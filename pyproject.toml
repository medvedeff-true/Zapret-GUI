[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zapret-gui"
version = "3.0.0"
description = "Windows GUI for managing Zapret/WinDivert bypass profiles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "requests>=2.31",
    "psutil>=5.9",
    "cryptography>=42",
    "websockets>=12",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.5"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bypass_service"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zapret_gui*", "adaptive_strategy*", "tg_ws_proxy_vendor*"]
